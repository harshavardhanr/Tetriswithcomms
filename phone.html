<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tetris Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: white;
            touch-action: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #connection-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        #connection-status {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            background: rgba(255, 165, 0, 0.3);
        }

        #connection-status.connected {
            background: rgba(76, 175, 80, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: transform 0.1s, background 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #controls {
            display: none;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        #controls.active {
            display: flex;
        }

        .control-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-btn {
            flex: 1;
            min-height: 80px;
            font-size: 24px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            user-select: none;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .control-btn .emoji {
            font-size: 32px;
        }

        .control-btn .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-rotate {
            background: rgba(255, 193, 7, 0.3);
        }

        .control-drop {
            background: rgba(244, 67, 54, 0.3);
        }

        .spacer {
            flex: 1;
        }

        @media (max-height: 600px) {
            .control-btn {
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Tetris Controller</h1>
        </header>

        <div id="connection-section">
            <div id="connection-status">Not Connected</div>
            <div class="input-group">
                <label for="peer-id-input">Enter VR Headset Peer ID:</label>
                <input type="text" id="peer-id-input" placeholder="vr-xxxxxxxxx">
            </div>
            <button id="connect-btn">Connect</button>
        </div>

        <div id="controls">
            <div class="control-row">
                <button class="control-btn control-rotate" data-command="rotate">
                    <span class="emoji">🔄</span>
                    <span class="label">Rotate</span>
                </button>
            </div>

            <div class="control-row">
                <button class="control-btn" data-command="left">
                    <span class="emoji">⬅️</span>
                    <span class="label">Left</span>
                </button>
                <button class="control-btn" data-command="down">
                    <span class="emoji">⬇️</span>
                    <span class="label">Down</span>
                </button>
                <button class="control-btn" data-command="right">
                    <span class="emoji">➡️</span>
                    <span class="label">Right</span>
                </button>
            </div>

            <div class="control-row">
                <button class="control-btn control-drop" data-command="drop">
                    <span class="emoji">⚡</span>
                    <span class="label">Hard Drop</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        class PhoneController {
            constructor() {
                this.peer = null;
                this.conn = null;
                this.connected = false;
                this.setupUI();
                this.loadPeerJS();
            }

            async loadPeerJS() {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js';
                script.onload = () => {
                    console.log('PeerJS loaded');
                    document.getElementById('connect-btn').disabled = false;
                };
                document.head.appendChild(script);
            }

            setupUI() {
                const connectBtn = document.getElementById('connect-btn');
                const peerIdInput = document.getElementById('peer-id-input');

                connectBtn.disabled = true;
                connectBtn.addEventListener('click', () => this.connect());

                // Allow Enter key to connect
                peerIdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.connect();
                    }
                });

                // Setup control buttons
                const controlButtons = document.querySelectorAll('.control-btn');
                controlButtons.forEach(btn => {
                    // Prevent default touch behavior
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.sendCommand(btn.dataset.command);
                    });

                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.sendCommand(btn.dataset.command);
                    });
                });

                // Prevent scrolling on the whole page
                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                }, { passive: false });
            }

            async connect() {
                const peerId = document.getElementById('peer-id-input').value.trim();

                if (!peerId) {
                    alert('Please enter a Peer ID');
                    return;
                }

                if (!window.Peer) {
                    alert('PeerJS is still loading, please wait...');
                    return;
                }

                try {
                    // Create peer with random ID
                    this.peer = new Peer('phone-' + Math.random().toString(36).substr(2, 9));

                    this.peer.on('open', (id) => {
                        console.log('Phone Peer ID:', id);
                        this.connectToPeer(peerId);
                    });

                    this.peer.on('error', (err) => {
                        console.error('Peer error:', err);
                        this.updateConnectionStatus('Connection Error', false);
                    });

                } catch (err) {
                    console.error('Failed to create peer:', err);
                    alert('Failed to initialize connection');
                }
            }

            connectToPeer(peerId) {
                this.updateConnectionStatus('Connecting...', false);

                this.conn = this.peer.connect(peerId, {
                    reliable: true
                });

                this.conn.on('open', () => {
                    console.log('Connected to VR headset!');
                    this.connected = true;
                    this.updateConnectionStatus('Connected to VR Headset', true);
                    document.getElementById('controls').classList.add('active');
                });

                this.conn.on('close', () => {
                    console.log('Connection closed');
                    this.connected = false;
                    this.updateConnectionStatus('Disconnected', false);
                    document.getElementById('controls').classList.remove('active');
                });

                this.conn.on('error', (err) => {
                    console.error('Connection error:', err);
                    this.updateConnectionStatus('Connection Failed', false);
                });
            }

            updateConnectionStatus(message, connected) {
                const statusElement = document.getElementById('connection-status');
                statusElement.textContent = message;

                if (connected) {
                    statusElement.classList.add('connected');
                } else {
                    statusElement.classList.remove('connected');
                }
            }

            sendCommand(command) {
                if (this.connected && this.conn) {
                    this.conn.send({ command: command });
                    console.log('Sent command:', command);

                    // Visual feedback
                    navigator.vibrate && navigator.vibrate(50);
                }
            }
        }

        // Initialize controller
        const controller = new PhoneController();
    </script>
</body>
</html>
