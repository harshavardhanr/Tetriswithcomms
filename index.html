<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Tetris - Quest Headset</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        #connectionStatus {
            color: #ff0;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>WebXR Tetris - Quest Headset</div>
        <div id="connectionStatus">Enter code to connect</div>
        <div id="gameStatus">Type the same code as on your phone</div>
    </div>
    <div id="connectPanel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);padding:30px;border-radius:10px;z-index:200;">
        <div style="color:white;margin-bottom:15px;">Enter code from phone:</div>
        <input type="text" id="connectionCode" maxlength="8" placeholder="e.g. ABC123" 
               style="font-size:24px;padding:15px;width:200px;text-align:center;text-transform:uppercase;letter-spacing:4px;">
        <button id="btnConnect" style="display:block;margin-top:15px;padding:15px 30px;font-size:18px;cursor:pointer;">Connect</button>
    </div>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="vr-tetris.js"></script>
</body>
</html>
